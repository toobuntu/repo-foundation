# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

# CodeRabbit config for the toobuntu repositories (ADR 0020). Canonical in
# repo-foundation and synced to consumers.
#
# Principle: CodeRabbit earns its keep on AI review (logic, design, cross-file
# reasoning) and on checks we do NOT already run ourselves. The one linter that
# would only duplicate a gate we own is turned off; the grammar checker, which
# is a distinct tool from our style linter, stays on; and the AI reviewer is
# given the house conventions it keeps missing.

language: en-US

reviews:
  # assertive surfaces more; matches the maintainer's web-UI setting.
  profile: assertive

  tools:
    # Off: repo-foundation enforces Markdown structure itself with rumdl reading
    # .rumdl.toml, in pre-commit (a plugin) and CI (ADR 0020). CodeRabbit runs
    # markdownlint-cli2; leaving it on only re-reports what our own gate already
    # blocked, under a different tool's defaults.
    markdownlint:
      enabled: false
    # On: LanguageTool is a grammar checker, a different tool from Vale (which
    # enforces the Toobuntu house STYLE and vocabulary, ADR 0014). Grammar
    # findings are additive, not duplicative; its comments can be declined.
    languagetool:
      enabled: true

  # Context the AI reviewer keeps missing. path_instructions guide the AI review
  # for matching files; they do not toggle linters (that is `tools` above).
  path_instructions:
    - path: "**"
      instructions: |
        Canonical-file neutrality, and its two deliberate exceptions. Files
        listed in sync-manifest.yaml sync byte-identical from repo-foundation
        (the org hub) to consumer repositories; DO flag consumer-specific
        names, paths, or assumptions inside those files. But do NOT flag
        references to repo-foundation itself — the hub is not a consumer, and
        hub references are the established convention (ADR URLs, plugin
        headers, canonical docs) — and do NOT propose rewriting measured
        transcripts or console output quoted in documentation into neutral
        placeholders merely to remove hub-specific details: transcripts record
        what actually happened, in the hub, and are labeled as such;
        falsifying them to look generic destroys the evidence they exist to
        preserve. DO flag secrets, credentials, personally identifying
        information (including personal usernames), and machine-specific paths
        or other sensitive data inadvertently captured in transcripts. Files
        not in the manifest are repo-local and the neutrality rule does not
        apply to them at all.
    - path: "**/*.{sh,bash,ksh}"
      instructions: |
        These repositories target macOS, which ships the BSD userland. Do NOT flag
        `/usr/bin/grep --null-data` (`-z`) or `/usr/bin/xargs --no-run-if-empty`
        (`-r`) as macOS/BSD incompatibilities. Verified on macOS 26.5.2 (build
        25F84): the system grep documents and supports `--null-data`/`-z`, and the
        system xargs accepts `--no-run-if-empty`/`-r` as a GNU-compatibility option
        (a no-op, because BSD xargs already skips execution on empty input). The
        portability note in .githooks/pre-commit cites the exact Apple source
        commits. Prefer long options with the short form in parentheses.
    - path: ".githooks/pre-commit.d/**"
      instructions: |
        Each pre-commit.d plugin is self-contained by design (ADR 0017): it runs as
        a subprocess and does not inherit the base hook's shell functions, so it
        re-declares its own staged()/staged_z()/has_files() helpers. This
        duplication is intentional and consistent across plugins; do not suggest
        replacing a plugin's helper with a bespoke one-off
        `git diff … -- <pathspec>` check.
        These plugins are POSIX `/bin/sh` but are EXTENSIONLESS (the run-parts
        classicalre rule, ADR 0017), so the `**/*.{sh,bash,ksh}` BSD-userland
        instruction does not reach them — it applies here too: do NOT flag
        `/usr/bin/xargs --no-run-if-empty` (`-r`) or `/usr/bin/grep --null-data`
        (`-z`) as macOS/BSD incompatibilities. Verified on macOS 26.5.2: the system
        xargs accepts `-r`/`--no-run-if-empty` (a no-op, since BSD xargs already
        skips empty input) and the system grep supports `-z`/`--null-data`.
    - path: "{.githooks/pre-commit.d/80-unicode,scripts/lint-unicode.*}"
      instructions: |
        ONE detector, three scopes (ADR 0006, amended 2026-07-29).
        scripts/lint-unicode.sh implements --scope=staged|tracked|tree; the
        80-unicode plugin is a thin caller of --scope=staged and owns no
        codepoint table, no annotation parsing, and no grep of its own. An
        earlier design duplicated the detector in the plugin on the grounds that
        it had to stay dependency-free; that was false (10-shell and 80-perms
        already call into scripts/) and the duplication is gone. Do NOT propose
        restoring a detector to the plugin, and do NOT describe the two files as
        copies to keep in sync — the spec now asserts the plugin carries NO
        table. The plugin hard-errors when the script is missing, deliberately:
        a security gate fails closed, and the manifest spec enforces that every
        git_hooks consumer also takes scripts_core.
        The staged scope materializes INDEX content with `git checkout-index`
        rather than reading working-tree files, so a file staged clean and then
        dirtied cannot smuggle content past the gate; do not propose scanning
        the working-tree path instead. Suppression of a finding requires BOTH
        halves of `file --mime` to say binary (the format AND the charset),
        because either alone is wrong in a measured case: a shell script with an
        embedded NUL is `charset=binary`, and a PostScript file is a denylisted
        `application/postscript` while being reviewable `utf-8` text.
        Both match with `grep --fixed-strings` under `LC_ALL=C`, deliberately. Do
        NOT suggest a UTF-8 locale (C.UTF-8, en_US.UTF-8, LC_CTYPE=UTF-8) or a
        bracket expression. A bracket expression is a set of CHARACTERS and needs a
        UTF-8 locale to read multi-byte sequences; where that locale is absent it
        silently degrades to a set of BYTES and matches the E2 lead byte shared by
        every U+2xxx character, so an ordinary em dash or curly quote trips the
        gate. Fixed strings compare exact byte sequences, need no locale, and
        cannot over-match because UTF-8 is self-synchronizing.
    - path: "spec/**"
      instructions: |
        `REUSE_LINT_SKIP=1` in the hook specs is load-bearing, not leftover: the
        85-reuse plugin reads it, and the runner still runs that plugin. Without it
        every throwaway fixture (no SPDX headers, no LICENSES/) fails the REUSE gate
        and masks the check under test. Do not suggest removing it.
    - path: "docs/decisions/**"
      instructions: |
        ADRs are MADR 4.0, linted by `adrs doctor`. The SPDX header belongs INSIDE
        the YAML frontmatter (placed there by scripts/annotate.sh), never as an HTML
        comment above the frontmatter — that breaks `adrs doctor`. `status` is
        lowercase by house convention, but the tool is case-insensitive, so do not
        flag a capitalized status value as an error.
