# CodeRabbit config for the toobuntu repositories (ADR 0020). Canonical in
# repo-foundation and synced to consumers.
#
# Principle: CodeRabbit earns its keep on AI review (logic, design, cross-file
# reasoning) and on checks we do NOT already run ourselves. The one linter that
# would only duplicate a gate we own is turned off; the grammar checker, which
# is a distinct tool from our style linter, stays on; and the AI reviewer is
# given the house conventions it keeps missing.

language: en-US

# CodeRabbit already scans **/AGENTS.md and **/CLAUDE.md by default — but
# AGENTS.md is mostly a pointer, and the operating principles reach it through
# `@docs/agent-principles.md`, a Claude Code IMPORT directive that CodeRabbit
# does not resolve. So it was reading the signpost and not the sign. Naming the
# imported file explicitly is what closes that gap, and it is why several
# org-wide rules had to be hand-transcribed into path_instructions below.
# Setting this key replaces the built-in list, so the defaults worth keeping are
# repeated here.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "docs/agent-principles.md"
      - "CONTRIBUTING.md"
      # architecture.md carries the sync contract — the engine's modes, the
      # ownership tiers, the trust boundaries — which is what a reviewer needs
      # to see that a change rewrites a file in every consumer. repo-standards
      # carries the enforcement table and the doc-distribution rule. The second
      # is repo-foundation-only; a pattern that matches nothing is harmless.
      - "docs/architecture.md"
      - "docs/repo-standards.md"

reviews:
  # assertive surfaces more; matches the maintainer's web-UI setting.
  profile: assertive

  tools:
    # Off: repo-foundation enforces Markdown structure itself with rumdl reading
    # .rumdl.toml, in pre-commit (a plugin) and CI (ADR 0020). CodeRabbit runs
    # markdownlint-cli2; leaving it on only re-reports what our own gate already
    # blocked, under a different tool's defaults.
    markdownlint:
      enabled: false
    # On: LanguageTool is a grammar checker, a different tool from Vale (which
    # enforces the Toobuntu house STYLE and vocabulary, ADR 0014). Grammar
    # findings are additive, not duplicative; its comments can be declined.
    languagetool:
      enabled: true

  # Context the AI reviewer keeps missing. path_instructions guide the AI review
  # for matching files; they do not toggle linters (that is `tools` above).
  path_instructions:
    - path: "**"
      instructions: |
        Canonical-file neutrality, and its two deliberate exceptions. Files
        listed in sync-manifest.yaml sync byte-identical from repo-foundation
        (the org hub) to consumer repositories; DO flag consumer-specific
        names, paths, or assumptions inside those files. But do NOT flag
        references to repo-foundation itself — the hub is not a consumer, and
        hub references are the established convention (ADR URLs, plugin
        headers, canonical docs) — and do NOT propose rewriting measured
        transcripts or console output quoted in documentation into neutral
        placeholders merely to remove hub-specific details: transcripts record
        what actually happened, in the hub, and are labeled as such;
        falsifying them to look generic destroys the evidence they exist to
        preserve. DO flag secrets, credentials, personally identifying
        information (including personal usernames), and machine-specific paths
        or other sensitive data inadvertently captured in transcripts. Files
        not in the manifest are repo-local and the neutrality rule does not
        apply to them at all.
    - path: ".vale/styles/config/vocabularies/Toobuntu/accept.txt"
      instructions: |
        This is a spelling accept list, and it is scoped to the SYNCED CORPUS
        rather than to this repository. Do NOT flag a consumer repository's
        name here (blackoutd, lume, rumdl, pipx, newsyslog and the like) as a
        consumer-specific identifier leaking into a canonical file — that
        reading is backwards, and it was ruled on 2026-08-04 with counts.
        repo-foundation pushes .ai/org/memory.md, docs/agent-principles.md and
        docs/testing-github-workflows-locally.md to every consumer, and those
        files name blackoutd, lume and rumdl (148 occurrences of lume in one of
        them). A term the hub SENDS to a consumer must be accepted there, or
        the consumer's own prose gate fails on content it did not write and
        cannot edit. The rule that does apply: a term used only in this
        repository's unsynced files belongs in a consumer's unsynced `Local`
        vocabulary instead, which foundation-init seeds for exactly this split.
        Entries are regular expressions, matched case-insensitively; one covers
        the possessive but NOT the plural, so `word(s)?` is normal and correct.
    - path: "**/*.{sh,bash,ksh}"
      instructions: |
        These repositories target macOS, which ships the BSD userland. Do NOT flag
        `/usr/bin/grep --null-data` (`-z`) or `/usr/bin/xargs --no-run-if-empty`
        (`-r`) as macOS/BSD incompatibilities. Verified on macOS 26.5.2 (build
        25F84): the system grep documents and supports `--null-data`/`-z`, and the
        system xargs accepts `--no-run-if-empty`/`-r` as a GNU-compatibility option
        (a no-op, because BSD xargs already skips execution on empty input). The
        portability note in .githooks/pre-commit cites the exact Apple source
        commits. Prefer long options with the short form in parentheses.
    - path: ".githooks/pre-commit.d/**"
      instructions: |
        Each pre-commit.d plugin is self-contained by design (ADR 0017): it runs as
        a subprocess and does not inherit the base hook's shell functions, so it
        re-declares its own staged()/staged_z()/has_files() helpers. This
        duplication is intentional and consistent across plugins; do not suggest
        replacing a plugin's helper with a bespoke one-off
        `git diff … -- <pathspec>` check.
        These plugins are POSIX `/bin/sh` but are EXTENSIONLESS (the run-parts
        classicalre rule, ADR 0017), so the `**/*.{sh,bash,ksh}` BSD-userland
        instruction does not reach them — it applies here too: do NOT flag
        `/usr/bin/xargs --no-run-if-empty` (`-r`) or `/usr/bin/grep --null-data`
        (`-z`) as macOS/BSD incompatibilities. Verified on macOS 26.5.2: the system
        xargs accepts `-r`/`--no-run-if-empty` (a no-op, since BSD xargs already
        skips empty input) and the system grep supports `-z`/`--null-data`.
    - path: "{.githooks/pre-commit.d/80-unicode,scripts/lint-unicode.*}"
      instructions: |
        ONE detector, three scopes (ADR 0006, amended 2026-07-29).
        scripts/lint-unicode.sh implements --scope=staged|tracked|tree; the
        80-unicode plugin is a thin caller of --scope=staged and owns no
        codepoint table, no annotation parsing, and no grep of its own. An
        earlier design duplicated the detector in the plugin on the grounds that
        it had to stay dependency-free; that was false (10-shell and 80-perms
        already call into scripts/) and the duplication is gone. Do NOT propose
        restoring a detector to the plugin, and do NOT describe the two files as
        copies to keep in sync — the spec now asserts the plugin carries NO
        table. The plugin hard-errors when the script is missing, deliberately:
        a security gate fails closed, and the manifest spec enforces that every
        git_hooks consumer also takes scripts_core.
        The staged scope materializes INDEX content with `git checkout-index`
        rather than reading working-tree files, so a file staged clean and then
        dirtied cannot smuggle content past the gate; do not propose scanning
        the working-tree path instead. Suppression of a finding requires BOTH
        halves of `file --mime` to say binary (the format AND the charset),
        because either alone is wrong in a measured case: a shell script with an
        embedded NUL is `charset=binary`, and a PostScript file is a denylisted
        `application/postscript` while being reviewable `utf-8` text.
        Both match with `grep --fixed-strings` under `LC_ALL=C`, deliberately. Do
        NOT suggest a UTF-8 locale (C.UTF-8, en_US.UTF-8, LC_CTYPE=UTF-8) or a
        bracket expression. A bracket expression is a set of CHARACTERS and needs a
        UTF-8 locale to read multi-byte sequences; where that locale is absent it
        silently degrades to a set of BYTES and matches the E2 lead byte shared by
        every U+2xxx character, so an ordinary em dash or curly quote trips the
        gate. Fixed strings compare exact byte sequences, need no locale, and
        cannot over-match because UTF-8 is self-synchronizing.
    - path: ".ai/**"
      instructions: |
        The `.ai/` continuity layer (repo-foundation ADR 0022). `memory.md` and
        `org/memory.md` are APPEND-ONLY, and that is mechanically enforced: the
        .githooks/pre-commit.d/40-memory plugin rejects any commit that removes
        a line from either. So do NOT suggest editing, rewriting, or deleting an
        existing entry to correct it, even when the entry is stale or wrong — the
        correction is a NEW dated entry (`## YYYY-MM-DD — Topic`) that names what
        it supersedes. Entries are historical records of what was true when
        written; staleness alone is not a defect. `AI_MEMORY_ALLOW_REWRITE=1`
        exists for the periodic consolidation pass only.
        `org/memory.md` is org-wide and edited ONLY in repo-foundation;
        `org/relay.md` is how another repository forwards a candidate entry
        here. `progress.md` is gitignored volatile state and is not reviewable.
        Canonical-file neutrality does NOT apply to these entries the way it
        applies to code, but one half of it does. Draw the line at what the
        detail identifies:
        KEEP repository names, repo-relative paths, symbol names, tool versions,
        and issue numbers. An org-memory entry names what its finding was
        measured against on purpose — an entry that says "a consumer
        repository" cannot be acted on, and those specifics are what let a
        later reader check whether the finding still holds. Do not suggest
        generalizing them away; that removes the evidence the entry exists to
        carry. (Ruled 2026-07-30.)
        DO flag machine-specific absolute paths (`/Users/<name>/…`,
        `/home/<name>/…`), personal usernames, and hostnames. Those identify a
        person or a machine rather than a fact, they are wrong for every other
        reader, and `.ai/org/memory.md` syncs to every consumer while ADR text
        is published. The repo-relative path or the `<repo-root>` placeholder
        carries the same information without the leak.
    - path: "{docs/prose-linting.md,CONTRIBUTING.md,provides/repo/CONTRIBUTING.baseline.md,.vale/styles/Toobuntu/**}"
      instructions: |
        Vale invocations in prose and comments are deliberately shorter than
        the gate's. The gate pipes through an xargs+sh readable-path filter
        that drops a tracked file deleted on disk without the deletion staged;
        the review-pass examples skip it on purpose. That case is worth
        handling silently in automation and not worth carrying in a command a
        human types, where the resulting `no such file` names the path. Do NOT
        ask for the filter to be added to a documented review invocation. The
        15-prose plugin DOES apply it to both of its passes; a claim that it
        is missing there is stale.

        Toobuntu.AbbreviationPluralsAmbiguous rides at warning permanently and
        must never be promoted to error or added to a gate: its matches are
        ambiguous by construction (a possessive before a participle is as
        legitimate as a plural is wrong), so they are surfaced for a human
        read. Suppressing a deliberate example is done with a code span, or a
        vale directive keyed on the WHOLE matched span. Do not suggest
        rewording prose to satisfy it.

    - path: "spec/**"
      instructions: |
        `REUSE_LINT_SKIP=1` in the hook specs is load-bearing, not leftover: the
        85-reuse plugin reads it, and the runner still runs that plugin. Without it
        every throwaway fixture (no SPDX headers, no LICENSES/) fails the REUSE gate
        and masks the check under test. Do not suggest removing it.
    - path: "docs/decisions/**"
      instructions: |
        ADRs are MADR 4.0, linted by `adrs doctor`. The SPDX header belongs INSIDE
        the YAML frontmatter (placed there by scripts/annotate.sh), never as an HTML
        comment above the frontmatter — that breaks `adrs doctor`. `status` is
        lowercase by house convention, but the tool is case-insensitive, so do not
        flag a capitalized status value as an error.
    - path: "{scripts/annotate.sh,scripts/pr-body-update.sh}"
      instructions: |
        Two settled rulings, both re-raised once already.

        Naming Homebrew is CORRECT here, not a leak. `brew
        generate-tap-man-completions` is this organization's own external
        command in its own taps, adapted from Homebrew's
        generate-man-completions, and it is the generator whose next run
        destroys an inline SPDX header — which is the whole reason completions
        get a `.license` sidecar. Generalizing it to "the generator" removes
        the one detail that makes the rule checkable. Do not suggest
        consumer-neutral wording for it.

        The pr-body marker constants are PREFIXES on purpose, and the ismark()
        predicate is a starts-with test on purpose. The full marker line
        carries a human-readable explanation ("managed by pr-body-update.sh;
        text outside is preserved") that must stay editable without breaking
        every open pull request. Requiring the normalized line to EQUAL the
        constant would match nothing at all, since the constants are only the
        stable leading fragment. Do not suggest exact equality.
    - path: "docs/agent-principles.md"
      instructions: |
        The `gh pr create` body-derivation snippet is a RECIPE a human runs and
        reads, not a script. Its failure mode is an empty pull-request body,
        which is loud and immediately visible before anything is published, and
        hardening it with temp files, status checks, and cleanup traps would
        roughly double the length of a recipe whose length is precisely why
        scripts/pr-body-update.sh was extracted. Do not suggest adding
        fail-fast handling, `set -e`, or temp-file management to it. Declined
        2026-08-03, twice.
    - path: "docs/decisions/README.md"
      instructions: |
        This file is ADR 0004's discoverability POINTER, not a project readme. Its
        whole job is to tell a reader landing in a consumer's docs/decisions/ that
        the org-wide records live in repo-foundation and are deliberately not
        copied. ADR 0008's standard-readme structure governs the repository ROOT
        readme; applying it here would grow a deliberately short pointer into a
        document nobody reads. Do not suggest adding standard-readme sections,
        badges, install/usage, or a table of contents.
    - path: "{.githooks/pre-commit.d/20-*,provides/githooks/pre-commit.d/20-*}"
      instructions: |
        The 20- language plugins read the WORKING TREE, not materialized index
        blobs. That is deliberate and consistent across 20-go, 20-brew, 20-swift,
        and 20-ruby: index materialization (`git checkout-index` into a temp tree)
        is reserved for 80-unicode, which is a SECURITY gate where the committed
        bytes are the thing under test (ADR 0006). A language check is a
        convenience gate whose CI job is the real backstop, its error messages must
        name the developer's own path to be actionable, and the partial-staging
        case is already handled by the auto-fix plugins' `git diff --quiet` guard
        (ADR 0017). Do not suggest converting a 20- plugin to `git show :path`.
