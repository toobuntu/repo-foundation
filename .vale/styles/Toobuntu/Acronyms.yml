# Provenance: adapted from Microsoft's Acronyms.yml (vale-cli/Microsoft), which
# is byte-equivalent to Google's apart from the message and link; the message
# below is Microsoft's verbatim. Also published via hyperlint's rule index.
#
# Define-on-first-use for acronyms: flag an all-caps acronym that is used
# without ever being spelled out, e.g. "Continuous Integration (CI)". The
# `exceptions` list holds established acronyms that need no definition; without
# it the rule flags every acronym and is unusably noisy (vale-styles-evaluation.md).
# Extend `exceptions` rather than relaxing the rule.
#
# Stays at WARNING, and unlike the other warning-level rules it is not on the
# ADR 0014 promotion path at all. Measured over the tracked Markdown
# (2026-08-04): after the two upstream fixes below it still reports ~273 times,
# and 60% of that is ordinary English written in capitals for emphasis — NOT,
# DONE, AND, ONE, ONLY, NEW, OPEN — which is this org's house style, not a
# defect. Clearing those would mean listing common words as "acronyms needing
# no definition", which would also stop the rule firing on a genuine undefined
# acronym that happens to be a word. See docs/prose-linting.md.
extends: conditional
message: "'%s' has no definition."
level: warning
scope: text
ignorecase: false
# Usage: a bare acronym. Definition: a spelled-out phrase followed by the
# acronym in parentheses.
#
# The {3,5} bound is upstream's and was restored here on 2026-08-04 after a
# local widening to {3,} was measured: unbounded, the pattern claims every long
# all-caps token, so file names (README, AGENTS, CONTRIBUTING, LICENSES) and
# long emphasis words (WITHOUT, REQUIRED, PROPOSED) all read as undefined
# acronyms. Restoring the bound removed 180 of 481 alerts and cost nothing —
# an acronym longer than five characters is vanishingly rare.
#
# `second` diverges from upstream deliberately, in two ways. `[\s-]?` accepts a
# hyphenated expansion; `[A-Za-z'’]*` accepts an apostrophe, so that a properly
# defined acronym like "You Aren't Gonna Need It (YAGNI)" is recognized —
# upstream's `[A-Z][a-z]+` rejects it and reports the acronym as undefined.
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][A-Za-z''’]*[\s-]?)+\(([A-Z]{3,5})\)'
exceptions:
  - API
  - APIs
  - ASCII
  - ASP
  - AST
  - BSD
  - CLI
  - CPU
  - CSS
  - CSV
  - CVE
  - CVEs
  - DEBUG
  - DNS
  - DOM
