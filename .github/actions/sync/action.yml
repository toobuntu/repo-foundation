name: Sync shared configuration
description: >-
  Apply repo-foundation's canonical files to one consumer checkout via
  .github/actions/sync/sync-files.rb. Writes the rendered files (no git
  commits) and, with emit_dir, records changes.json and pr-body.md for the
  calling workflow's Git Data commit loop.

inputs:
  repo:
    description: Consumer repository slug, e.g. toobuntu/blackoutd.
    required: true
  target_path:
    description: Path to the already checked-out consumer repository.
    required: true
  manifest_path:
    description: >-
      Optional override for the manifest path. Defaults to
      repo-foundation/sync-manifest.yaml (resolved relative to the engine).
    required: false
    default: ""
  emit_dir:
    description: >-
      Directory to write changes.json and pr-body.md into (for the Git Data
      commit loop). Omit to skip emission.
    required: false
    default: ""
  dry_run:
    description: When 'true', report changes without writing.
    required: false
    default: "false"

outputs:
  changed:
    description: "'true' when the engine wrote changes into the target."
    value: ${{ steps.sync.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Run sync engine
      id: sync
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        TARGET_PATH: ${{ inputs.target_path }}
        MANIFEST_PATH: ${{ inputs.manifest_path }}
        EMIT_DIR: ${{ inputs.emit_dir }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        args=("$REPO" "$TARGET_PATH")
        if [ "$DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        if [ -n "$EMIT_DIR" ]; then
          args+=(--emit-dir "$EMIT_DIR")
        fi
        if [ -n "$MANIFEST_PATH" ]; then
          export SYNC_MANIFEST="$MANIFEST_PATH"
        fi
        # Ruby is preinstalled on GitHub-hosted runners; the engine is stdlib
        # only, so no bundler or setup-ruby step is required.
        ruby "${GITHUB_ACTION_PATH}/sync-files.rb" "${args[@]}"
