name: Actionlint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: "actionlint-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  workflow_syntax:
    name: Workflow syntax
    if: github.repository_owner == 'toobuntu'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      - uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          install: act actionlint shellcheck zizmor

      - run: zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name != 'merge_group'
        with:
          name: results.sarif
          path: results.sarif

      - name: Set up actionlint matcher
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"

      - name: Lint workflows
        run: |
          # Bare actionlint walks .github/workflows/ and nothing else.
          actionlint
          # repo-foundation additionally holds canonical workflow MASTERS
          # under provides/github/workflows/. No repo runs a workflow from
          # that path -- the sync renders them into consumers -- so without
          # naming them explicitly they would reach every consumer having
          # never been linted anywhere. The directory does not exist in a
          # consumer, where this whole step is just the bare run above.
          if [ -d provides/github/workflows ]; then
            find provides/github/workflows -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print0 |
              xargs -0 -r actionlint
          fi

      # act's own workflow parser as a second net; parse-only, so no container
      # or Docker daemon is involved.
      - name: act workflow parse check
        run: act --container-architecture=NOASSERTION --validate

  upload_sarif:
    name: Upload SARIF
    needs: workflow_syntax
    if: >
      always() &&
      !contains(fromJSON('["cancelled", "skipped"]'), needs.workflow_syntax.result) &&
      !github.event.repository.private &&
      github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: results.sarif
          path: results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
          category: zizmor
