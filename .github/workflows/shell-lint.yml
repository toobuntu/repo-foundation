name: shell-lint

# shfmt (formatting) + shellcheck (static analysis) on shell, via
# scripts/lint-shell.sh --tracked — the same script the
# .githooks/pre-commit.d/10-shell plugin runs with --staged. Synced to
# non-Homebrew consumers; Homebrew-aligned repos run shfmt + shellcheck through
# `brew style` instead and do not receive this workflow (ADR 0017).

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  shell-lint:
    if: github.repository_owner == 'toobuntu'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both tools come from the runner's Homebrew (not on PATH by default),
      # matching a local `brew install`, with its bin prepended (ADR 0014's
      # pattern).
      #
      # shellcheck IS pre-installed on the runner, and this deliberately does
      # not use that copy: the image's version trails Homebrew's, and the two
      # disagree about which findings exist. That skew became a gate failure
      # once lint-shell.sh moved to --severity=style (ADR 0023 amendment):
      # runner shellcheck 0.9.x reports SC2015 on `[ -n "$a" ] && [ -n "$b" ]
      # || fallback`, a conjunction guard that 0.11.0 correctly leaves alone,
      # so CI failed on code the pre-commit hook had just passed. A gate that
      # is stricter in CI than on the machine that has to satisfy it is worse
      # than a lax one — it moves discovery past the commit. Installing from
      # the same source developers use makes the two agree by construction.
      #
      # ksh is NOT installed here: lint-shell.sh runs `ksh -n` only when ksh is
      # present (stock on macOS, absent on the Ubuntu runner), so this generic
      # workflow skips it rather than paying an install on every consumer to
      # re-check scripts that came from repo-foundation. A ksh-heavy repo
      # (cert-automation) installs ksh93 in its own CI to check its own scripts.
      - name: Install shfmt and shellcheck
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install shfmt shellcheck
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Record tool versions
        run: |
          shellcheck --version
          shfmt --version

      - name: Lint shell
        run: scripts/lint-shell.sh --tracked
