# RSpec suite for the canonical git hooks and the CI Unicode scanner. Canonical
# in toobuntu/repo-foundation and synced (with the spec/ tree, Gemfile, .rspec
# and .bundle/config) to consumers that adopt the hook test suite.

name: Spec

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  spec:
    # macOS so /bin/sh (bash --posix) and BSD grep match what the hook runs
    # under on contributors' machines. Portable Ruby is the same Ruby that
    # `brew ruby` uses locally, so local and CI share one test toolchain.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew portable Ruby
        uses: Homebrew/actions/setup-ruby@main
        with:
          portable-ruby: true
          bundler-cache: true

      # vale is needed by vale_style_spec (the Toobuntu rule regression tests);
      # without it that spec skips, so install it to make the rules a CI gate.
      # rumdl and adrs are stubbed in their specs and need no install.
      - name: Install vale
        run: brew install vale

      - name: Run RSpec
        run: bundle exec rspec

      # Scope 3 (ADR 0006): the whole working tree, vendored content included.
      # This is the one job where that scope is reachable in CI -- the setup
      # step above ran `bundle install`, and .bundle/config puts gems in
      # vendor/bundle/, so the runner now holds the dependency source a bare
      # checkout never has. Trojan Source deceives a human reading a diff, so
      # a dependency nothing here builds is still in scope; a finding under
      # vendor/ is an upstream report, not a local fix.
      - name: Scan the whole tree for invisible Unicode
        run: scripts/lint-unicode.sh --scope=tree
