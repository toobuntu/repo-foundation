name: prose

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  vale:
    if: github.repository_owner == 'toobuntu'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install Vale from the runner's pre-installed Homebrew (ADR 0014). brew
      # is on the runner but not on PATH, so invoke it by absolute path and add
      # its bin to GITHUB_PATH for the lint step.
      - name: Install Vale
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install vale
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      # A bare `vale` exits non-zero on any error-level alert under
      # MinAlertLevel = error, so the exit code is a sufficient gate — no
      # reviewdog, no reporter, no GITHUB_TOKEN (ADR 0014). The style and vocab
      # are committed under .vale/styles/, so no `vale sync` is needed.
      # Lint the TRACKED Markdown (same command as the documented local gate):
      # vale has no .gitignore support, so a bare `vale .` would also scan any
      # untracked vendored docs a prior step created (none today; this keeps
      # the CI scope identical to the local one by construction). The xargs+sh
      # filter drops any tracked-but-absent path (deleted on disk without
      # staging) before the single vale run; a no-op on a clean checkout.
      - name: Run Vale
        run: |
          # shellcheck disable=SC2016  # $@/$f expand in the inner sh -c, by design
          git ls-files -z '*.md' |
            xargs -0 -r sh -c 'for f in "$@"; do [ -r "$f" ] && printf "%s\0" "$f"; done' keep-readable |
            xargs -0 -r vale

      # Informational only, and deliberately so. MinAlertLevel = error discards
      # warning-level alerts, so Toobuntu.AbbreviationPluralsAmbiguous never
      # appears in the gate above -- its matches are ambiguous by construction
      # (a possessive before a participle is as legitimate as a plural is
      # wrong), so they want a human read, not a failed build. The 15-prose
      # pre-commit plugin surfaces them at authoring time, but git hooks are
      # opt-in (core.hooksPath), so this step is the only exposure a
      # contributor who never enabled them gets. --no-exit keeps it from
      # gating; `if: always()` runs it even when the gate above failed, since
      # an error and an ambiguity are independent findings. No reviewdog and no
      # annotation: this is a log to read when reviewing, not a change request.
      - name: Report ambiguous abbreviation plurals (informational)
        if: always()
        run: |
          # shellcheck disable=SC2016  # $@/$f expand in the inner sh -c, by design
          git ls-files -z '*.md' |
            xargs -0 -r sh -c 'for f in "$@"; do [ -r "$f" ] && printf "%s\0" "$f"; done' keep-readable |
            xargs -0 -r vale --no-exit --minAlertLevel=warning \
              --filter='.Name=="Toobuntu.AbbreviationPluralsAmbiguous"'
